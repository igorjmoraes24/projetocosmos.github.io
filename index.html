<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cosmos Memory Hub</title>
    <link rel="stylesheet" href="styles.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
</head>
<body>
    <header class="site-header">
        <div class="logo-box">
            <div class="logo-mark"><i class='bx bxs-rocket'></i></div>
            <div>
                <h1>Cosmos Memory</h1>
                <p>Desafie sua memória no espaço</p>
            </div>
        </div>
    </header>

    <main class="register-shell">
        <div class="modal-card register-card">
            <h2>Bem-vindo, explorador!</h2>
            <p>Digite seu nome para começar sua jornada pela memória cósmica.</p>
            <input id="playerNameInput" type="text" maxlength="20" placeholder="Seu nome" autocomplete="off">
            <button id="startGameButton" class="modal-button primary" type="button">Jogar</button>
        </div>
    </main>

    <script src="register.js"></script>
</body>
</html>
